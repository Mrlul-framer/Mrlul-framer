<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">mrlul</title>
<desc id="d">I build interfaces that feel like worlds, not pages. A glowing doorway sits on the right.</desc>
<defs>
  <clipPath id="win"><rect width="1000" height="380" rx="16"/></clipPath>
  <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="0.25" stop-color="#F107A3"/>
    <stop offset="0.7" stop-color="#7B2FF7"/><stop offset="1" stop-color="#2a0b57"/>
  </linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F107A3"/><stop offset="1" stop-color="#7B2FF7"/>
  </linearGradient>
  <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#F107A3" stop-opacity="0.55"/><stop offset="1" stop-color="#7B2FF7" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <style>
    .pulse{animation:pulse 5s ease-in-out infinite;transform-origin:800px 250px}
    .glow{animation:glow 5s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes glow{0%,100%{opacity:.55}50%{opacity:.95}}
    @media (prefers-reduced-motion:reduce){.pulse,.glow{animation:none}}
  </style>
</defs>
<g clip-path="url(#win)">
  <rect width="1000" height="380" fill="#000"/>
  <ellipse class="glow" cx="800" cy="250" rx="240" ry="200" fill="url(#spill)"/>
  <path class="glow" d="M722 400 V196 A78 78 0 0 1 878 196 V400 Z" fill="#F107A3" opacity=".6" filter="url(#blur)"/>
  <path class="pulse" d="M735 400 V196 A65 65 0 0 1 865 196 V400 Z" fill="url(#door)"/>
  <path d="M735 400 V196 A65 65 0 0 1 865 196 V400" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="2"/>
  <ellipse cx="800" cy="372" rx="110" ry="9" fill="#F107A3" opacity=".35" filter="url(#blur)"/>
  <!-- title bar -->
  <rect width="1000" height="38" fill="#000"/>
  <line x1="0" y1="38" x2="1000" y2="38" stroke="#2b1346"/>
  <circle cx="24" cy="19" r="6" fill="#F107A3"/><circle cx="46" cy="19" r="6" fill="#7B2FF7"/><circle cx="68" cy="19" r="6" fill="#fff"/>
  <text x="500" y="24" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9a86c2">mrlul</text>
  <!-- copy -->
  <text x="56" y="178" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" fill="#fff">mrlul</text>
  <text x="60" y="236" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#eadcff">I build interfaces that feel like worlds,</text>
  <text x="60" y="268" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#eadcff">not pages.</text>
  <text x="60" y="326" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#a48ccc">Front-end developer in Jizzakh, Uzbekistan</text>
</g>
<rect x="1" y="1" width="998" height="378" rx="15" fill="none" stroke="url(#rim)" stroke-opacity=".7" stroke-width="2"/>
</svg>